---
- name: Installer Apache sur la famille Debian (Ubuntu)
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Installer Apache sur la famille RedHat (CentOS, Amazon Linux)
  ansible.builtin.include_tasks: centos.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Déployer la page d'accueil HTML (template Jinja2)
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"